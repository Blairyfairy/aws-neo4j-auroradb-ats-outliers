<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume ATS Outlier Dashboard</title><link rel="stylesheet" href="style.css"></head>
<body><div class="blob b1"></div><div class="blob b2"></div>
<main>
<header class="glass"><h1>Resume ATS Outlier Dashboard</h1><p id="who">Loading analysis…</p>
<div class="stats"><div><b id="sOut">0</b><span>Outlier jobs</span></div><div><b id="sBest">0</b><span>Best ATS score</span></div><div><b id="sSkills">0</b><span>Skills in graph</span></div><div><b id="sCreds">0</b><span>Credentials</span></div></div></header>
<section class="glass controls">
<input id="q" type="search" placeholder="Filter by title or company…">
<select id="company"><option value="">All companies</option></select>
<label>Min ATS score <b id="rv">55</b><input id="ratio" type="range" min="30" max="100" value="55"></label>
<label>Max missing <b id="mv">2</b><input id="maxm" type="range" min="1" max="4" value="2"></label>
<label class="chk"><input id="all" type="checkbox"> Show all scored jobs</label>
</section>
<section id="jobs" class="grid"></section>
<section class="glass"><h2>Skill tree parsed from index.html</h2><div id="tree"></div></section>
</main><script src="app.js"></script></body></html>
